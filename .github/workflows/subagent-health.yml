name: Subagent Health

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run validator
        id: validate
        continue-on-error: true
        run: npm run validate 2>&1 | tee subagent-health.log
      - name: Upload health log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subagent-health-log
          path: subagent-health.log
      - name: Create or update alert issue
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Subagent Health: affiliate validation failed';
            const labels = ['subagent-alert', 'automation'];
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'subagent-alert', per_page: 100
            });
            const body = `Automated affiliate validation failed on **${context.ref}**.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nReview the uploaded \\`subagent-health-log\\` artifact and fix the failing affiliate validation.`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body, labels });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const issue = await github.rest.issues.create({ owner, repo, title, body, labels });
              core.info(`Created issue #${issue.data.number}`);
            }
      - name: Fail health check
        if: steps.validate.outcome == 'failure'
        run: exit 1
