name: Subagent Health

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm ci > install_output.txt 2>&1
          exit_code=$?
          echo "INSTALL_EXIT_CODE=$exit_code" >> install_output.txt
          echo "INSTALL_EXIT_CODE=$exit_code" >> "$GITHUB_ENV"
          exit "$exit_code"

      - name: Run validator and capture result
        id: validate
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          npm run validate > validator_output.txt 2>&1
          exit_code=$?
          echo "Validator exit code: $exit_code" >> validator_output.txt
          cp validator_output.txt subagent-health.log
          echo "VALIDATOR_EXIT_CODE=$exit_code" >> "$GITHUB_ENV"
          exit 0

      - name: Capture install failure
        if: steps.install.outcome != 'success'
        shell: bash
        run: |
          echo "Dependency installation failed." > subagent-health.log
          cat install_output.txt >> subagent-health.log
          echo "VALIDATOR_EXIT_CODE=2" >> "$GITHUB_ENV"
          echo "Validator was not run because npm ci failed." >> validator_output.txt

      - name: Upload health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subagent-health-log
          path: |
            subagent-health.log
            validator_output.txt
            install_output.txt
          if-no-files-found: warn

      - name: Create or update alert issue
        if: env.VALIDATOR_EXIT_CODE != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = '🚨 Subagent Health: affiliate validation failed';
            const labels = ['subagent-alert', 'automation'];
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'subagent-alert', per_page: 100
            });
            const log = fs.existsSync('validator_output.txt')
              ? fs.readFileSync('validator_output.txt', 'utf8')
              : fs.existsSync('subagent-health.log')
                ? fs.readFileSync('subagent-health.log', 'utf8')
                : 'Validator failed; no diagnostic output file was produced.';
            const body = [
              `Automated affiliate validation failed on **${context.ref}**.`,
              '',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              '### Validator output',
              '```text',
              log.slice(-12000),
              '```'
            ].join('\n');
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body, labels });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const issue = await github.rest.issues.create({ owner, repo, title, body, labels });
              core.info(`Created issue #${issue.data.number}`);
            }

      - name: Fail health check
        if: env.VALIDATOR_EXIT_CODE != '0'
        run: |
          echo "Health check failed with exit code $VALIDATOR_EXIT_CODE"
          exit "$VALIDATOR_EXIT_CODE"
